name: Quality checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # npm 10.9.x can crash in Arborist's peer resolver on currently published
      # optional peer combinations ("Cannot read properties of null (reading 'edgesOut')");
      # npm 11.19.1 includes the fix and is compatible with this Node 22 runner.
      - name: Use npm with peer-resolution fix
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build
